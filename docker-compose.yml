services:
  # ── Local Vision Server (llama.cpp + Qwen3VL on RX 6600) ──
  llamacpp-vision:
    build: ./llamacpp-vision
    container_name: llamacpp-vision
    ports:
      - "6663:6663"
    volumes:
      # Mount your model directory from host
      - /mnt/hdd/ai-models:/models:ro
    devices:
      # ROCm GPU access (AMD RX 6600)
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - HIP_VISIBLE_DEVICES=0
      # If OOM with 4096, reduce to 2048
      # - CTX_SIZE=2048
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6663/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  whisper:
    build: ./whisper
    container_name: whisper
    ports:
      - "1233:1233"
    restart: unless-stopped
    # Simple TCP healthcheck - whisperfile doesn't have a /health endpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1233/v1/audio/transcriptions || [ $? -eq 405 ] || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  captcha-solver:
    build: ./captcha-solver
    container_name: captcha-solver
    ports:
      - "1232:8000"
    depends_on:
      llamacpp-vision:
        condition: service_healthy
      whisper:
        condition: service_started
    environment:
      # Docker service name as hostname (containers share default bridge network)
      # llamacpp-vision container serves Qwen3VL on port 6663
      - LLAMACPP_URL=http://llamacpp-vision:6663
      - VISION_MODEL=Qwen3VL-8B-Instruct-Q4_K_M
      - UNLOAD_AFTER_SOLVE=false
      # Whisper audio transcription service
      - WHISPER_URL=http://whisper:1233
      # OpenRouter fallback (only used if local vision server is down)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - FALLBACK_ENABLED=${FALLBACK_ENABLED:-true}
      - FALLBACK_VISION_MODEL=meta-llama/llama-4-maverick:free
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  captcha-bridge:
    build: ./captcha-bridge
    container_name: captcha-bridge
    # Note: ports: mapping is ignored with network_mode: host
    # The app binds directly to port 1231 on the host
    environment:
      # OhMyCaptcha config
      - CLIENT_KEY=local
      - SERVER_PORT=1231
      - CAPTCHA_RETRIES=3
      - CAPTCHA_TIMEOUT=60
      - BROWSER_HEADLESS=false
      - BROWSER_TIMEOUT=30
      # CDP: network_mode: host, so localhost IS the host's localhost
      - CDP_URL=http://localhost:9222
      # Shim: network_mode: host, use host-mapped port 1232
      - SHIM_URL=http://localhost:1232
      # Cloud model (OpenAI-compatible)
      - CLOUD_BASE_URL=http://localhost:1232/v1
      - CLOUD_API_KEY=sk-local
      - CLOUD_MODEL=Qwen3VL-8B-Instruct-Q4_K_M
      # Local model (self-hosted vision server on port 6663)
      - LOCAL_BASE_URL=http://localhost:1232/v1
      - LOCAL_API_KEY=sk-local
      - LOCAL_MODEL=Qwen3VL-8B-Instruct-Q4_K_M
    # Use host network so localhost:9222 in container = host localhost:9222
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1231/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - BROWSER_TIMEOUT=120000
      - CAPTCHA_SOLVER=none
      - TZ=America/New_York
    restart: unless-stopped
