<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OhMyCaptcha Solver Options</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        h1 { font-size: 20px; }
        label { display: block; margin: 12px 0 4px; font-weight: 500; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .row { margin: 8px 0; }
        button { padding: 10px 20px; background: #4CAF50; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .saved { color: #4CAF50; margin-left: 12px; display: none; }
    </style>
</head>
<body>
    <h1>OhMyCaptcha Solver Options</h1>
    <div class="row">
        <label>API URL (OhMyCaptcha)</label>
        <input type="text" id="apiUrl" value="http://localhost:1231">
    </div>
    <div class="row">
        <label>API Key</label>
        <input type="text" id="apiKey" value="local">
    </div>
    <div class="row">
        <label>Auto-solve reCAPTCHA v2</label>
        <input type="checkbox" id="autoSolveRecaptchaV2">
    </div>
    <div class="row">
        <label>Auto-solve hCaptcha</label>
        <input type="checkbox" id="autoSolveHCaptcha">
    </div>
    <button id="saveBtn">Save</button>
    <span class="saved" id="savedMsg">Saved!</span>
    <script src="options.js"></script>
</body>
</html>
