<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 320px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        h1 { font-size: 16px; margin: 0 0 12px 0; }
        label { display: block; margin: 8px 0 4px; font-size: 12px; color: #555; }
        input[type="text"] { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .toggle-row { display: flex; align-items: center; margin: 10px 0; gap: 8px; }
        .toggle-row label { margin: 0; cursor: pointer; }
        .toggle-row input[type="checkbox"] { width: auto; margin: 0; }
        button { width: 100%; padding: 8px; margin-top: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        .status { margin-top: 8px; font-size: 12px; padding: 6px; border-radius: 4px; }
        .status.ok { background: #d4edda; color: #155724; }
        .status.err { background: #f8d7da; color: #721c24; }
        .note { font-size: 11px; color: #888; margin-top: 8px; }
        hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>OhMyCaptcha Solver</h1>
    <label>API URL (OhMyCaptcha)</label>
    <input type="text" id="apiUrl" placeholder="http://192.168.3.25:1231" value="http://192.168.3.25:1231">
    <label>API Key</label>
    <input type="text" id="apiKey" placeholder="local" value="local">

    <hr>

    <div class="toggle-row">
        <input type="checkbox" id="autoClick">
        <label for="autoClick">Auto-click solve button</label>
    </div>

    <button id="saveBtn">Save & Test</button>
    <div id="status" class="status" style="display:none;"></div>
    <div class="note">All tasks go to OhMyCaptcha. Image grids are handled by the vision model.</div>
    <script src="popup.js"></script>
</body>
</html>
